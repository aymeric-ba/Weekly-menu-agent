name: Weekly Menu Generator

on:
  schedule:
    # Every Friday at 7:00 UTC (= 8:00 CET / 9:00 CEST)
    # Note: adjust to 0 6 * * 5 during summer (CEST) if you want strict 8am
    - cron: '0 7 * * 5'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  generate-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly menu and create Google Tasks list
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/generate_menu.py
